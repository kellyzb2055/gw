name: build-verify

on:
  push:
    branches: [ci/verify-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 探测 VSTO 工具链
        shell: pwsh
        run: |
          Write-Host "=== VS 版本目录 ==="
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Name }

          Write-Host "=== OfficeTools targets ==="
          $targets = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\MSBuild\Microsoft\VisualStudio\v17.0\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets' -ErrorAction SilentlyContinue
          if ($targets) { $targets | ForEach-Object { "找到: $($_.FullName)" } }
          else { Write-Host "未找到 OfficeTools targets" }

          Write-Host "=== VSTO PIA 目录 ==="
          $pia = 'C:\Program Files (x86)\Microsoft Visual Studio\Shared\Visual Studio Tools for Office\PIA'
          if (Test-Path $pia) { Get-ChildItem $pia -ErrorAction SilentlyContinue | ForEach-Object { "找到: $($_.Name)" } }
          else { Write-Host "未找到 VSTO PIA 目录" }

          Write-Host "=== Office.Tools 程序集 ==="
          @(
            'C:\Windows\Microsoft.NET\assembly\GAC_MSIL\Microsoft.Office.Tools',
            'C:\Windows\assembly\GAC_MSIL\Microsoft.Office.Tools'
          ) | ForEach-Object { if (Test-Path $_) { "存在: $_" } }

          Write-Host "=== Office Interop 程序集 ==="
          @(
            'C:\Windows\assembly\GAC_MSIL\Microsoft.Office.Interop.Word',
            'C:\Windows\Microsoft.NET\assembly\GAC_MSIL\Microsoft.Office.Interop.Word'
          ) | ForEach-Object { if (Test-Path $_) { "存在: $_" } }

      - name: 安装 NuGet
        uses: nuget/setup-nuget@v1

      - name: 还原 NuGet 包
        run: nuget restore src\公文排版.csproj -PackagesDirectory packages -NonInteractive

      - name: 配置 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 还原签名证书
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw '未配置 PFX_BASE64 Secret，无法还原签名证书' }
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\xkonglong.com.pfx'
          [System.IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($path)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('My','CurrentUser')
          $store.Open('ReadWrite')
          $store.Add($cert)
          $store.Close()
          Write-Host "证书已导入 CurrentUser\My: $($cert.Thumbprint)"

      - name: 编译 Release
        run: msbuild src\公文排版.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:SignManifests=true /p:ManifestCertificateThumbprint=6F5E89EB98A164A7A28E8A08C9D005727987B689 /v:normal /nologo

      - name: 校验 VBA 脚本过程名可识别
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'VBA Script'
          if (-not (Test-Path $dir)) { Write-Host '未找到 VBA 脚本目录，跳过'; exit 0 }

          $pattern = '^[ \t]*(?:Public[ \t]+|Private[ \t]+|Friend[ \t]+)?(?:Static[ \t]+)?(?:Sub|Function)[ \t]+([^\s(]+)'
          $options = [System.Text.RegularExpressions.RegexOptions]::Multiline -bor [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
          $enc = [System.Text.Encoding]::GetEncoding(936)

          $failed = @()
          $files = Get-ChildItem $dir -Filter *.vba -File
          foreach ($f in $files) {
            $code = [System.IO.File]::ReadAllText($f.FullName, $enc)
            $m = [System.Text.RegularExpressions.Regex]::Match($code, $pattern, $options)
            if ($m.Success) {
              Write-Host ("OK   {0} -> {1}" -f $f.Name, $m.Groups[1].Value)
            } else {
              Write-Host ("FAIL {0}" -f $f.Name)
              $failed += $f.Name
            }
          }

          Write-Host "共 $($files.Count) 个脚本，失败 $($failed.Count) 个"
          if ($failed.Count -gt 0) {
            Write-Error ("以下脚本无法识别出 Sub/Function 过程名: " + ($failed -join ', '))
            exit 1
          }

      - name: 打包安装脚本
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'install'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'src\bin\Release'
          if (-not (Test-Path $src)) { throw '未找到 install 目录' }

          # .ps1 统一转成 UTF-8 带 BOM，保证 Windows PowerShell 5.1 能正确读取中文键名
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          foreach ($f in Get-ChildItem $src -File) {
            $target = Join-Path $dst $f.Name
            if ($f.Extension -eq '.ps1') {
              [System.IO.File]::WriteAllText($target, [System.IO.File]::ReadAllText($f.FullName), $utf8Bom)
            } else {
              Copy-Item $f.FullName $target -Force
            }
            Write-Host "已打包: $($f.Name)"
          }

      - name: 校验安装脚本语法
        shell: pwsh
        run: |
          $dst = Join-Path $env:GITHUB_WORKSPACE 'src\bin\Release'
          $scripts = Get-ChildItem $dst -Filter *.ps1 -ErrorAction SilentlyContinue
          if (-not $scripts) { throw '产物目录中没有安装脚本' }

          foreach ($f in $scripts) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Error "$($f.Name) 语法错误: $($errors[0].Message)（第 $($errors[0].Extent.StartLineNumber) 行）"
              exit 1
            }
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            Write-Host "OK $($f.Name) （BOM: $hasBom）"
          }

      - name: 列出产物
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== bin\Release ==="
          Get-ChildItem 'src\bin\Release' -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

          Write-Host "=== 安装脚本 ==="
          Get-ChildItem 'src\bin\Release' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.ps1', '.bat' } |
            Select-Object Name, Length | Format-Table -AutoSize

          Write-Host "=== .vsto 部署信息 ==="
          $vsto = Get-ChildItem 'src\bin\Release\*.vsto' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vsto) {
            $raw = Get-Content $vsto.FullName -Raw
            if ($raw -match 'codebase="([^"]*)"') { Write-Host "deploymentProvider: $($matches[1])" } else { Write-Host 'deploymentProvider: 未找到' }
            if ($raw -match 'publisherIdentity name="([^"]*)"') { Write-Host "publisher: $($matches[1])" } else { Write-Host 'publisherIdentity: 未找到' }
            if ($raw -match '<Signature') { Write-Host '清单签名: 有' } else { Write-Host '清单签名: 无' }
          }

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gw-build-${{ github.run_number }}
          path: src/bin/Release/**
          if-no-files-found: warn
